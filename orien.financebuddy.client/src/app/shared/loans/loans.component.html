<div class="container-fluid">
  <div class="my-3 d-flex justify-content-between">
    <h2>Loans</h2>
    <div class="d-flex align-items-center">
      <h3 class="mb-0 mr-3">Total Loan Amount: <span class="text-success">{{loanAmountTotal | currency: 'INR'}}</span></h3>
      <h3 class="mb-0 mr-3">Total Monthly EMI: <span class="text-success">{{loanMonthlyEMITotal | currency: 'INR'}}</span></h3>
      <button mat-raised-button class="mr-3" color="primary" (click)="getLoans()"><mat-icon>refresh</mat-icon> Refresh</button>
      <button mat-raised-button color="primary" (click)="openLoanDialog()"><mat-icon>add</mat-icon> Add Loan</button>
    </div>
  </div>
  
  <!-- Loan List in Table -->
  <table mat-table [dataSource]="loans" class="mat-elevation-z8" matSort>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let loan">{{ loan.name }}</td>
    </ng-container>

    <!-- Bank Column -->
    <ng-container matColumnDef="bank">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Bank</th>
      <td mat-cell *matCellDef="let loan">{{ loan.bank.name }}</td>
    </ng-container>

    <!-- Amount Column -->
    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
      <td mat-cell *matCellDef="let loan">{{ loan.amount | currency: 'INR' }}</td>
    </ng-container>

    <!-- Monthly EMI Column -->
    <ng-container matColumnDef="monthly_Emi">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Monthly EMI</th>
      <td mat-cell *matCellDef="let loan">{{ loan.monthly_Emi | currency: 'INR' }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let loan">
        <button mat-button color="accent" (click)="openLoanDialog(loan)"><mat-icon>edit</mat-icon>Edit</button>
        <button mat-button color="accent" (click)="deleteLoan(loan)"><mat-icon>delete</mat-icon>Delete</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
</div>
