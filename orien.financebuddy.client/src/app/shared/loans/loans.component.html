<div class="container">
    <h2>Loans</h2>
    
    <!-- Add Loan Button -->
    <button mat-raised-button color="primary" (click)="openLoanDialog()">Add Loan</button>
    
    <!-- Loan List in Table -->
    <table mat-table [dataSource]="loans" class="mat-elevation-z8" matSort>
  
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let loan">{{ loan.name }}</td>
      </ng-container>
  
      <!-- Bank Column -->
      <ng-container matColumnDef="bank">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Bank</th>
        <td mat-cell *matCellDef="let loan">{{ loan.bank }}</td>
      </ng-container>
  
      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Amount</th>
        <td mat-cell *matCellDef="let loan">{{ loan.amount }}</td>
      </ng-container>
  
      <!-- Monthly EMI Column -->
      <ng-container matColumnDef="monthly_Emi">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Monthly EMI</th>
        <td mat-cell *matCellDef="let loan">{{ loan.monthly_Emi }}</td>
      </ng-container>
  
      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let loan">
          <button mat-button color="accent" (click)="openLoanDialog(loan)">Edit</button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  </div>
